<div id="fx-app">
<style>
#fx-app{font-family:system-ui,sans-serif;color:#eef6ff;background:#0b1628;padding:26px;border-radius:18px;max-width:1000px;margin:auto;box-sizing:border-box;min-height:680px}
#fx-app *{box-sizing:border-box}#fx-app header{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
#fx-app .eyebrow{color:#7dd3fc;letter-spacing:2px;font-size:12px}#fx-app h2{font-size:28px;margin:5px 0}#fx-app .muted{color:#a9bad1;font-size:14px}
#fx-app .badge{background:#483311;color:#ffe09b;border:1px solid #7b5a20;padding:8px 12px;border-radius:30px;font-size:12px}
#fx-app .summary{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:#15263d;border:1px solid #30445e;padding:20px;margin:22px 0;border-radius:12px}
#fx-app .amount{font-size:32px;font-weight:750;color:#75efb8;font-variant-numeric:tabular-nums}#fx-app button{cursor:pointer;font:inherit;border-radius:9px;padding:12px 18px;border:0;background:#77efb8;color:#08261b;font-weight:650}#fx-app button:hover{filter:brightness(1.08)}#fx-app button:focus-visible,#fx-app input:focus-visible{outline:3px solid #38bdf8;outline-offset:3px}#fx-app button:disabled{opacity:.6;cursor:wait}
#fx-app .table-wrap{overflow-x:auto}#fx-app table{border-collapse:collapse;width:100%;min-width:500px}#fx-app th{background:#182b45;text-align:left;font-size:12px;color:#a9c5e5;padding:14px 12px}#fx-app td{padding:13px 12px;border-bottom:1px solid #233752;font-size:14px}#fx-app .num{text-align:right;font-variant-numeric:tabular-nums}#fx-app .result{color:#75efb8;font-size:19px;font-weight:700}#fx-app .code{font-weight:750;color:white;font-size:16px}#fx-app footer{font-size:12px;line-height:1.8;color:#a9bad1;margin-top:20px}#fx-app .status{margin-top:10px;min-height:22px;font-size:13px;color:#83d5ff}
#fx-app dialog{color:#14243a;background:#fff;border:0;border-radius:18px;padding:26px;width:min(440px,90vw);box-shadow:0 25px 70px #0007}#fx-app dialog::backdrop{background:#020b19b8}#fx-app dialog h3{margin:0 0 8px;font-size:23px}#fx-app dialog p{color:#53657c;line-height:1.6}#fx-app label{display:block;margin:20px 0 8px;font-weight:650}#fx-app input{width:100%;border:1px solid #a9b8c9;border-radius:8px;padding:13px;font-size:22px;color:#16283c;background:white}#fx-app .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}#fx-app .secondary{background:#e5ecf3;color:#29435e}#fx-app .error{color:#b42318;min-height:22px;font-size:13px;margin-top:8px}
@media(max-width:600px){#fx-app{padding:16px}#fx-app h2{font-size:23px}#fx-app .amount{font-size:27px}}
</style>
<header>
  <div>
    <div class="eyebrow">PYTHON • STUDENT EXCHANGE LAB</div>
    <h2>กระดานแลกเปลี่ยนเงินตรา</h2>
    <div class="muted">เงินบาท → เงินต่างประเทศ · โปรเจกต์งานคู่</div>
  </div>
</header>
</div>
